# 人生模拟游戏合集 · Nginx 站点配置（ECS 自建或 Docker 镜像共用）
# 站点根目录就是 dist/：/ 是游戏大厅，/jianghuyimeng/ 是江湖一梦。
server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    charset utf-8;
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # 页面和每个游戏的 config.js 每次都向服务器确认，改完马上生效
    location ~* (\.html|/config\.js)$ { add_header Cache-Control "no-cache"; }

    # 其他 css、js 带版本号，可以长期缓存
    location ~* \.(?:css|js)$ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location ~* \.(?:woff2?|ttf|otf|png|jpg|svg)$ { add_header Cache-Control "public, max-age=2592000"; }

    location / { try_files $uri $uri/ =404; }
}
